<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline';"
    />
    <title>Claude Buddy</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      canvas.hot {
        cursor: pointer;
      }
      canvas.dragging {
        cursor: grabbing;
      }
    </style>
  </head>
  <body>
    <canvas id="c" title="Click to ask Buddy · drag to move · right-click for options"></canvas>
    <script src="../shared/sprite.js"></script>
    <script src="mascot.js"></script>
  </body>
</html>
